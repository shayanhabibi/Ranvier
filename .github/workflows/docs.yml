name: Docs

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The Solid plugin compiles the live examples with Fable and Node.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build the site
        run: dotnet fsi build.fsx -- docs --quick
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
